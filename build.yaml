---
# NOTE: ZMK v0.4 (Zephyr 4.1) は Hardware Model v2 のボード命名を要求する。
#       seeeduino_xiao_ble -> xiao_ble/nrf52840/zmk
include:
  - board: xiao_ble/nrf52840/zmk
    shield: cool642tb_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: cool642tb_right
  - board: xiao_ble/nrf52840/zmk
    shield: cool642tb_L rgbled_adapter
    artifact-name: cool642tb_left
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: cool642tb_reset
