# ==========================================
# System Settings
# ==========================================
CONFIG_ZMK_KEYBOARD_NAME="cool642tb"
CONFIG_NFCT_PINS_AS_GPIOS=y

# ==========================================
# Connection Performance (矛盾解消・高速化)
# ==========================================
# 接続間隔を短縮 (6*1.25=7.5ms 〜 12*1.25=15ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 動き出し遅延ゼロ (Wake-up Latency対策)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 【重要】Experimental(2M無効機能)をオフにし、2Mbps(高速モード)を有効化
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# 送信バッファ拡張 (親機はパケットが詰まりやすいため拡張必須)
#CONFIG_BT_BUF_ACL_TX_COUNT=10
#CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# ==========================================
# BLE TX Power (単4電池パワー解放)
# ==========================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_TX_PWR_PLUS_4=n

# ==========================================
# Mouse & Trackball
# ==========================================
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PMW3610=y

# =========================================================
# Section: Trackball Settings
# ---------------------------------------------------------
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_SIMPLE=y
CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_OFFICE_TRACKBALL=y

# ==========================================
# Encoders
# ==========================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==========================================
# ZMK Studio (遅延対策)
# ==========================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n

# ==========================================
# Power Management
# ==========================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Coin Cell Management (元の設定2800mVを維持)
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=2000
CONFIG_ZMK_NON_LIPO_MAX_MV=2800
CONFIG_ZMK_NON_LIPO_LOW_MV=1900

# ==========================================
# Eager Debouncing (キー反応速度アップ)
# ==========================================
# キー入力の反応を高速化
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# ==========================================
# RGB LED Settings
# ==========================================
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=0
