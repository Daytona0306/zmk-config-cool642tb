# ========================================
# Input & Hardware Settings
# ========================================
# Key Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Encoder (EC11)
CONFIG_EC11=y
# 右半分 (central) 側のコメント参照。実機確認済みの GLOBAL のまま。
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# Bluetooth & Connectivity
# ========================================
# Bluetooth Power & Connection Tweaks
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ペアリング上限。右半分と揃える。
CONFIG_BT_MAX_PAIRED=7

# 通信安定化の独自設定（1Mbps固定・干渉への耐性強化）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Connection Parameters (右半分と揃える)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_CTLR_PHY_2M=n

# ========================================
# Power Management
# ========================================
# Sleep & Soft Off
CONFIG_ZMK_SLEEP=y
# 1800000ms = 30 minutes (右半分と揃える)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_PM_SOFT_OFF=y

# ========================================
# Battery Settings
# ========================================
# Basic Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Split Keyboard Battery Reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Non-LiPo Battery Management (Coin cell etc.)
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=2000
CONFIG_ZMK_NON_LIPO_MAX_MV=2800
CONFIG_ZMK_NON_LIPO_LOW_MV=1900

# ========================================
# Features, System & Settings
# ========================================
# peripheral 側は Studio を持たない。右半分と揃える必要があるのは以下。
# DATA_LEN と KSCAN_DIAGNOSTICS は右半分と揃えること。診断のクエリに答えるのは
# peripheral 側なので、こちらにも必要になる。揃っていないと右半分のビルドが
# BUILD_ASSERT で落ちる。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48

# フリーズ・ハードフォルト・予期しないリセットを Flash に記録する。
# 周辺側 (左手) も自分自身のインシデントを記録し、中央側から中継して
# DYA Studio の「安定性」タブで参照できる。
CONFIG_ZMK_WATCHDOG=y

CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
